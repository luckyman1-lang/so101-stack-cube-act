<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SO-101 项目进度看板</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --text:#1f2328; --dim:#68707a;
    --todo:#9aa4b0; --doing:#2f6fed; --done:#1a9e5c; --blocked:#e0343c; --accent:#2f6fed;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;
         position:sticky;top:0;z-index:10}
  h1{margin:0 0 2px;font-size:17px;font-weight:650}
  .sub{color:var(--dim);font-size:12px}
  .overall{margin-top:10px;display:flex;align-items:center;gap:12px}
  .bar{flex:1;height:9px;background:#eceff3;border-radius:5px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#2f6fed,#1a9e5c);
         width:0;transition:width .45s ease}
  .pct{font-variant-numeric:tabular-nums;font-weight:650;min-width:44px;text-align:right}
  .conn{font-size:11px;color:var(--dim)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#1a9e5c;
       margin-right:5px;vertical-align:1px}
  .dot.off{background:#c9ced6}
  main{padding:16px 22px 60px;max-width:1180px;margin:0 auto}
  .grid{display:grid;grid-template-columns:1fr;gap:10px}
  .mod{background:var(--card);border:1px solid var(--line);border-radius:9px;
       padding:12px 14px;display:grid;grid-template-columns:56px 1fr 210px;gap:14px;
       align-items:start;transition:box-shadow .15s}
  .mod:hover{box-shadow:0 2px 10px rgba(20,30,50,.07)}
  .mod.blocked{border-left:3px solid var(--blocked)}
  .mod.done{border-left:3px solid var(--done)}
  .mod.doing{border-left:3px solid var(--doing)}
  .mid{font-weight:700;font-size:15px;color:var(--dim);padding-top:1px}
  .name{font-weight:640;margin-bottom:1px}
  .desc{color:var(--dim);font-size:12px;margin-bottom:6px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:5px}
  .row label{font-size:11.5px;color:var(--dim)}
  select,input[type=text],textarea{font:inherit;font-size:12.5px;color:var(--text);
      background:#fbfcfd;border:1px solid var(--line);border-radius:6px;padding:4px 7px;outline:none}
  select:focus,input:focus,textarea:focus{border-color:var(--accent);background:#fff}
  textarea{width:100%;resize:vertical;min-height:34px;margin-top:6px}
  input[type=range]{width:120px;accent-color:var(--accent)}
  .right{display:flex;flex-direction:column;gap:7px}
  .prog{display:flex;align-items:center;gap:8px}
  .prog .p{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);min-width:34px}
  .st{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:600;display:inline-block}
  .st.todo{background:#eef0f3;color:var(--todo)}
  .st.doing{background:#e8f0fe;color:var(--doing)}
  .st.done{background:#e5f6ed;color:var(--done)}
  .st.blocked{background:#fdeaea;color:var(--blocked)}
  .meta{font-size:11px;color:#9aa4b0}
  .deps{font-size:11px;color:var(--dim);margin-top:3px}
  .deps b{color:#c0392b;font-weight:600}
  h2{font-size:13px;color:var(--dim);font-weight:650;text-transform:uppercase;
     letter-spacing:.06em;margin:26px 0 9px}
  .logbox{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:4px 0}
  .li{display:flex;gap:10px;padding:7px 14px;border-bottom:1px solid #f0f2f5;font-size:12.5px}
  .li:last-child{border-bottom:none}
  .li time{color:#9aa4b0;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:11.5px;padding-top:2px}
  .who{font-weight:650;color:var(--accent);white-space:nowrap}
  .logform{display:flex;gap:8px;margin-top:9px}
  .logform input{flex:1}
  button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;
         border-radius:6px;padding:5px 12px;cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  button:hover{filter:brightness(.97)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
         background:#1f2328;color:#fff;padding:8px 16px;border-radius:8px;font-size:12.5px;
         opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
  .toast.on{opacity:.94}
  @media(max-width:820px){
    .mod{grid-template-columns:44px 1fr;}
    .right{grid-column:1/-1;}
  }
</style>
</head>
<body>
<header>
  <h1 id="title">SO-101 项目进度看板</h1>
  <div class="sub"><span id="meta">加载中…</span></div>
  <div class="overall">
    <div class="bar"><i id="obar"></i></div>
    <div class="pct" id="opct">0%</div>
    <div class="conn" id="conn"><span class="dot off"></span>连接中</div>
  </div>
</header>

<main>
  <div class="grid" id="mods"></div>

  <h2>活动记录</h2>
  <div class="logbox" id="logs"></div>
  <form class="logform" id="logform">
    <select id="who" style="width:88px"></select>
    <input type="text" id="logtext" placeholder="今天做了什么 / 有什么阻塞…" maxlength="300">
    <button class="primary" type="submit">追加</button>
  </form>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let state = null, editing = false, dirty = false, timer = null, pulling = false;

const STATUS = {todo:'未开始', doing:'进行中', done:'已完成', blocked:'阻塞'};

function fmtTime(t){
  if(!t) return '';
  const d = new Date(t);
  if(isNaN(d)) return t;
  const p = n => String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function statusOf(m){
  // 依赖没完成时，未开始的模块自动提示
  return m.status || 'todo';
}

function render(){
  if(!state) return;
  $('#title').textContent = state.project || '项目进度看板';
  $('#meta').textContent =
    `版本 v${state.version} · 最后更新 ${fmtTime(state.updated)}` +
    (state.updated_by ? ` by ${state.updated_by}` : '');

  // 总进度
  const ms = state.modules || [];
  const total = ms.length ? Math.round(ms.reduce((a,m)=>a+(m.progress||0),0)/ms.length) : 0;
  $('#obar').style.width = total + '%';
  $('#opct').textContent = total + '%';

  // 成员下拉
  const mem = state.members || {};
  const whoSel = $('#who');
  if(whoSel.dataset.filled !== String(Object.keys(mem).length)){
    whoSel.innerHTML = Object.entries(mem)
      .map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
    whoSel.dataset.filled = Object.keys(mem).length;
  }

  // 模块
  const box = $('#mods');
  box.innerHTML = '';
  ms.forEach((m, i) => {
    const doneIds = new Set(ms.filter(x=>x.status==='done').map(x=>x.id));
    const waiting = (m.deps||[]).filter(d=>!doneIds.has(d));
    const st = statusOf(m);
    const el = document.createElement('div');
    el.className = 'mod ' + st;
    el.innerHTML = `
      <div class="mid">${m.id}</div>
      <div>
        <div class="name">${m.name}</div>
        <div class="desc">${m.desc||''}</div>
        <div class="row">
          <label>状态</label>
          <select data-k="status" data-i="${i}">
            ${Object.entries(STATUS).map(([k,v])=>
              `<option value="${k}" ${k===st?'selected':''}>${v}</option>`).join('')}
          </select>
          <label>负责人</label>
          <select data-k="owner" data-i="${i}">
            ${Object.keys(mem).concat(['A+B']).map(k=>
              `<option value="${k}" ${k===m.owner?'selected':''}>${k==='A+B'?'A+B 共同':mem[k]||k}</option>`).join('')}
          </select>
          ${waiting.length?`<span class="deps">等待：<b>${waiting.join(', ')}</b></span>`:''}
        </div>
        <textarea data-k="note" data-i="${i}" placeholder="备注 / 阻塞 / 下一步…">${m.note||''}</textarea>
      </div>
      <div class="right">
        <div class="prog">
          <input type="range" min="0" max="100" step="5" value="${m.progress||0}" data-k="progress" data-i="${i}">
          <span class="p">${m.progress||0}%</span>
        </div>
        <div><span class="st ${st}">${STATUS[st]}</span></div>
        <div class="meta">${m.updated_by?`${m.updated_by} · ${fmtTime(m.updated_at)}`:'—'}</div>
      </div>`;
    box.appendChild(el);
  });

  // 日志
  const lg = $('#logs');
  lg.innerHTML = (state.log||[]).slice().reverse().map(e=>`
    <div class="li">
      <time>${fmtTime(e.time)}</time>
      <span class="who">${(state.members||{})[e.who]||e.who}</span>
      <span>${escapeHtml(e.text)}</span>
    </div>`).join('') || '<div class="li" style="color:#9aa4b0">还没有记录</div>';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- 同步 ----------
async function pull(){
  if(pulling || editing || dirty) return;
  pulling = true;
  try{
    const r = await fetch('/api/state', {cache:'no-store'});
    const s = await r.json();
    if(!state || s.version !== state.version){
      state = s; render();
    }
    setConn(true);
  }catch(e){ setConn(false); }
  finally{ pulling = false; }
}

let connOn = null;
function setConn(on){
  if(connOn === on) return;
  connOn = on;
  $('#conn').innerHTML = on
    ? '<span class="dot"></span>已连接 · 实时同步'
    : '<span class="dot off"></span>连接断开，重试中';
}

async function push(){
  if(!state) return;
  const snapshot = JSON.parse(JSON.stringify(state));
  try{
    const r = await fetch('/api/state', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(snapshot)
    });
    if(r.status === 409){
      const d = await r.json();
      state = d.state; dirty = false; render();
      toast('队友刚改过，已刷新为最新版本');
      return;
    }
    if(!r.ok) throw new Error('HTTP '+r.status);
    state = await r.json();
    dirty = false;
    render();
  }catch(e){ toast('保存失败：'+e.message); }
}

function schedulePush(){
  dirty = true;
  clearTimeout(timer);
  timer = setTimeout(push, 700);
}

// ---------- 交互 ----------
document.addEventListener('focusin', e=>{
  if(['SELECT','TEXTAREA','INPUT'].includes(e.target.tagName)) editing = true;
});
document.addEventListener('focusout', e=>{
  if(['SELECT','TEXTAREA','INPUT'].includes(e.target.tagName)){
    setTimeout(()=>{ editing = false; }, 120);
  }
});

$('#mods').addEventListener('input', e=>{
  const t = e.target;
  const k = t.dataset.k, i = t.dataset.i;
  if(k === undefined || i === undefined) return;
  const m = state.modules[+i];
  if(!m) return;
  if(k === 'progress') m.progress = +t.value;
  else m[k] = t.value;
  m.updated_by = $('#who').value || m.updated_by;
  m.updated_at = new Date().toISOString();
  if(k === 'progress'){
    // 只更新百分比文字，避免整表重绘打断拖动
    t.parentElement.querySelector('.p').textContent = t.value + '%';
  }
  if(k === 'status'){
    // 状态胶囊即时变化
    const pill = t.closest('.mod').querySelector('.st');
    pill.className = 'st ' + t.value;
    pill.textContent = STATUS[t.value];
  }
  schedulePush();
});

$('#logform').addEventListener('submit', async e=>{
  e.preventDefault();
  const txt = $('#logtext').value.trim();
  if(!txt) return;
  const who = $('#who').value;
  state.log = state.log || [];
  state.log.push({time:new Date().toISOString(), who, text:txt});
  state.updated_by = who;
  $('#logtext').value = '';
  await push();
  toast('已记录');
});

let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('on'), 2200);
}

// ---------- 启动 ----------
pull().then(()=>{ render(); });
setInterval(pull, 2000);
// 页面重新可见时立即拉一次
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pull(); });
</script>
</body>
</html>

# ============================================================
#  LeRobot SO-101 项目配置（Windows）
#  改完直接保存，scripts\ 下的脚本会自动读取本文件。
#
#  ── 本机硬件（已确认）──────────────────────────────
#  套件：SO-101 标准版 + 组装版
#    * 电源：主臂、从臂**都是 5V**（Pro 版才会用 12V，接错会烧舵机）
#    * 组装版舵机 ID / 波特率出厂已写好 → **跳过 02_setup_motors.ps1**
#    * 直接走：01 找串口 → 03 校准 → 04 遥操作 → ...
#
#  第一次使用顺序：
#   1) 插上主臂/从臂 USB（电源也要接，USB 只通信不供电）
#   2) powershell -ExecutionPolicy Bypass -File scripts\00_env_check.ps1    环境自检
#   3) 串口已填好（主臂 COM10 / 从臂 COM11）；换 USB 口后 COM 号可能变，
#      用 -Watch 重新确认：scripts\01_find_ports.ps1 -Watch
# ============================================================

[robot]
# 从臂（白色，负责执行动作）
# CH343 USB 串口，序列号 5CE5117738（COM 号变了就用这个序列号认）
port = COM11
id   = my_follower

[teleop]
# 主臂（黑色，被人手拖动）
# CH343 USB 串口，序列号 5CE5122545
port = COM10
id   = my_leader

[cameras]
# 摄像头索引从 0 开始。
#   powershell -ExecutionPolicy Bypass -File scripts\01_find_ports.ps1 -Cams -Snapshot
#   会给每个可用索引存一张快照，打开 _setup\cam_snapshots 确认哪个对着桌面。
# 不需要的摄像头把 *_enabled 改成 false
# 注意：索引号是 Windows 按枚举顺序分配的。本机【索引 0 = 笔记本内置摄像头，
# 索引 1 = Orbbec Gemini 2】。若以后插拔导致错位，跑 scripts 里的预览脚本重新确认：
#   _setup\preview_cameras.py （管理员权限，会并排显示所有相机）
front_enabled = true
front_index   = 1
front_width   = 640
front_height  = 480
front_fps     = 30

# 腕部相机（可选）：本机【没有】装腕部相机，保持 false。
# 注意别把 wrist_index 设成 1 —— 那个索引已经被上面的前置相机占用了。
wrist_enabled = false
wrist_index   = 2
wrist_width   = 640
wrist_height  = 480
wrist_fps     = 30

[dataset]
# 采集用数据集，必须是 "用户名/数据集名" 两段格式
# （push_to_hub=false 时纯本地，前缀随便写；将来要传 HuggingFace 就换成你的用户名）
repo_id = local/stack_cube_v2
# 所有数据集的存放根目录，实际数据集目录 = root_dir\数据集名
root_dir = D:\LeRobot\datasets
# 一般留空；要显式指定数据集目录时才填
root =
# 任务描述：模型会记住这句话，写清楚"抓什么、放到哪"
single_task = Stack the green cube on top of the red cube
# 录制多少轮
num_episodes = 20
# 每一轮最长录制时长（秒）；动作做完可以按 → 提前结束本轮
episode_time_s = 30
# 每轮之间的整理时间（秒）
reset_time_s = 10
fps = 30
# 还没登录 Hugging Face 就保持 false
push_to_hub = false
# 是否语音播报（调用 Windows 语音合成）
play_sounds = true

[train]
policy     = act
output_dir = D:\LeRobot\outputs\train\stack_cube_v2
job_name   = stack_cube_act
# 只本地训练时随便填；要上传 HF 就填 "用户名/模型名"
policy_repo_id = local/stack_cube_v2_act
# 训练步数：本机 4060(8G) + 20~50 组数据，先跑 2~4 万步看效果
steps       = 40000
batch_size  = 8
num_workers = 4
save_freq   = 10000
log_freq    = 100
# cuda / cpu / mps
device      = cuda
# none / swanlab / wandb / both
tracker     = swanlab
swanlab_project = lerobot_stack_cube_v2
# cloud（需要先 swanlab login）/ offline / local / disabled
# 还没注册 SwanLab 账号先用 offline，训练照样记录，之后可同步
swanlab_mode = offline

[policy]
# 推理用模型路径。留空 = 自动取 train.output_dir 下最新的 checkpoint
path =
# 推理时采集的数据集必须以 eval_ 开头（LeRobot 的硬性要求）
eval_repo_id = local/eval_stack_cube_v2
num_episodes = 10
episode_time_s = 30
